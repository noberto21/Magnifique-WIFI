<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login | Berto Wi-Fi</title>
  <style>
    :root { --blue:#2165f5; --ink:#17202b; --muted:#718096; --line:#e4eaf1; }
    * { box-sizing:border-box; } body { display:grid; place-items:center; min-height:100vh; margin:0; padding:20px; color:var(--ink); background:#f6f8fb; font:15px/1.5 Inter,Segoe UI,Arial,sans-serif; }
    .box { width:min(100%,410px); padding:34px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px #1b335c12; }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:30px; font-size:20px; font-weight:800; } .mark { display:grid; place-items:center; width:36px; height:36px; color:#fff; border-radius:10px; background:var(--blue); }
    h1 { margin:0 0 5px; font-size:25px; } .intro { margin:0 0 24px; color:var(--muted); } label { display:block; margin:16px 0 6px; font-weight:700; }
    input { width:100%; padding:12px; border:1px solid #ccd6e2; border-radius:8px; font:inherit; } input:focus { outline:2px solid #bfd2ff; border-color:var(--blue); }
    button { width:100%; margin-top:22px; padding:12px; cursor:pointer; border:0; border-radius:8px; color:#fff; background:var(--blue); font:inherit; font-weight:800; }
    .errorlist { margin:10px 0; padding:10px 12px; color:#a62626; border-radius:8px; background:#fff0f0; list-style:none; } .back { display:block; margin-top:20px; color:var(--blue); text-align:center; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <main class="box">
    <div class="brand"><span class="mark">⌁</span>Berto Wi-Fi</div>
    <h1>Admin dashboard</h1>
    <p class="intro">Sign in with an authorized staff account.</p>
    {% if form.errors %}
      <ul class="errorlist"><li>Enter a valid username and password for an authorized account.</li></ul>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'/admin-dashboard/' }}">
      <label for="id_username">Username</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <a class="back" href="/">← Back to customer page</a>
  </main>
</body>
</html>
